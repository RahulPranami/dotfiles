image {
    monitor =
    path = ~/.config/hypr/user.jpeg
    ; path = /home/rahul/Downloads/sam.jpeg
    # path = /path/to/your/beautiful/image.jpg  # Replace with a calming, high-quality background image
    # size = 180
    # rounding = 10

    position = 0, 180
    halign = center
    valign = center
}

background {
    monitor =
    path = screenshot
    # path = /home/rahul/Pictures/Wallpapers/1353575.jpeg
    # path = /home/rahul/Downloads/1353575.jpeg
    # path = /home/rahul/Downloads/1275991.jpg

    # background = /home/rahul/Downloads/1266894.jpg
    # color = rgba(10, 10, 10, 0.8)
    # blur_passes = 1

    blur_passes = 1 # 0 disables blurring
    blur_size = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}



