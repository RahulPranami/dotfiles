label {
    monitor =
    text = Welcome back, $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 35
    # font_family = "Roboto, sans-serif"  # Elegant and clean font
    font_family = "Fira Code Nerd Font"

    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 25%, 6%
    outline_thickness = 4
    inner_color = rgba(0, 0, 0, 0.2)

    outer_color = rgba(33ccff, 1) rgba(00ff99, 1) 45deg
    check_color = rgba(00ff99, 1) rgba(ff6633, 1) 120deg
    fail_color = rgba(ff6633, 1) rgba(ff0066, 1) 40deg

    font_color = rgb(211, 211, 211)
    fade_on_empty = false
    rounding = 10

    position = 0, -20
    halign = center
    valign = center
}

shape {
    monitor =
    size = 500, 350
    color = rgba(0, 0, 0, 0.5)
    rounding = 10
    border_size = 5
    border_color = rgba(0, 207, 230, 1.0)

    position = 0, 100
    halign = center
    valign = center
}

